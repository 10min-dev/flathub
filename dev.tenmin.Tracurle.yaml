app-id: dev.tenmin.Tracurle
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: Tracurle
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --filesystem=host
modules:
  - name: tracurle
    buildsystem: simple
    build-commands:
      - install -D dev.tenmin.Tracurle.desktop /app/share/applications/dev.tenmin.Tracurle.desktop
      - install -D dev.tenmin.Tracurle.metainfo.xml /app/share/metainfo/dev.tenmin.Tracurle.metainfo.xml
      - install -D dev.tenmin.Tracurle.png /app/share/icons/hicolor/512x512/apps/dev.tenmin.Tracurle.png
      - install -D apply_extra /app/bin/apply_extra
    sources:
      - type: extra-data
        filename: tracurle-linux-x64.tar.gz
        url: https://github.com/10min-dev/apps/releases/download/tracurle-v1.0.2/tracurle-linux-x64.tar.gz
        sha256: ACBBB081CE085710D6D4B4D69F2B560A202186DCF59DD4D531A8859B1735E4D1
        size: 77195973

      - type: file
        path: apply_extra
        permissions: '0755'
        contents: |
          #!/bin/sh
          mkdir -p /app/app
          tar -xzf tracurle-linux-x64.tar.gz -C /app/app
          ln -s /app/app/Tracurle /app/bin/Tracurle
          rm tracurle-linux-x64.tar.gz

      - type: file
        path: dev.tenmin.Tracurle.desktop
      - type: file
        path: dev.tenmin.Tracurle.metainfo.xml
      - type: file
        path: dev.tenmin.Tracurle.png
